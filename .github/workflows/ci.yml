name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://finance:finance@127.0.0.1:5433/finance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # conftest SKIPS db tests when Postgres is unreachable; fail loudly
      # here instead so a misconfigured service can't produce a green run.
      - name: Verify test database is reachable
        run: python -c "import psycopg; psycopg.connect('${TEST_DATABASE_URL}', connect_timeout=5).close()"
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: PIP=pip ./deploy/build_lambda.sh
      - uses: actions/upload-artifact@v7
        with:
          name: lambda-zip
          path: deploy/lambda.zip
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: lambda-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lambda-zip
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: >
          aws lambda update-function-code
          --function-name personal-finance-mcp
          --zip-file fileb://lambda.zip
      - run: aws lambda wait function-updated --function-name personal-finance-mcp
      # Same artifact also backs the scheduled sync function (handler differs,
      # set in its function config). Keep both functions on the same code.
      - run: >
          aws lambda update-function-code
          --function-name personal-finance-mcp-sync
          --zip-file fileb://lambda.zip
      - run: aws lambda wait function-updated --function-name personal-finance-mcp-sync

  smoke:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check (retries absorb cold start)
        env:
          MCP_REMOTE_URL: ${{ secrets.MCP_REMOTE_URL }}
        run: |
          BASE="${MCP_REMOTE_URL%/mcp}"
          ok=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$BASE/health"; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ]
      - name: tools/list returns at least 28 tools
        env:
          MCP_REMOTE_URL: ${{ secrets.MCP_REMOTE_URL }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          COUNT=$(curl -fsS --max-time 30 -X POST "$MCP_REMOTE_URL" \
            -H "authorization: Bearer $MCP_AUTH_TOKEN" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | jq '.result.tools | length')
          echo "tools: $COUNT"
          [ "$COUNT" -ge 28 ]
